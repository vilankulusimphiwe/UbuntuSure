<div class="login_background_container">
  <div class="login_container">
    <h1>Welcome Back</h1>
    <p>Sign in to access your account</p>

      <form (ngSubmit)="signIn()">
        <div class="login_field">
          <span class="material-icons login_field_icon" aria-hidden="true">person</span>
          <input id="UserName"
            class="login_input"
            type="text"
            name="UserName"
            [(ngModel)]="UserName"
            autocomplete="username"
            placeholder="Username" />
        </div>

        <div class="login_field">
        <span class="material-icons login_field_icon" aria-hidden="true">lock</span>
        <input
          id="Password"
          class="login_input login_input_password"
          [type]="showPassword ? 'text' : 'password'"
          name="Password"
          [(ngModel)]="Password"
          autocomplete="current-password"
          placeholder="Password"
        />
        <button
          type="button"
          class="login_eye"
          (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <span class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>

        <div class="login_options">
          <label class="login_remember">
          <input type="checkbox" name="RememberMe" [(ngModel)]="RememberMe" />
          Remember me
          </label>
          <a class="login_forgot" href="#">Forgot password?</a>
        </div>

        <button class="login_button" type="submit">Sign In</button>
        
      </form>

      <footer class="app_footer">
        <p>Developed by Simphiwe Vilankulu | Professional Portfolio Project</p>
      </footer>

  </div>
</div>
